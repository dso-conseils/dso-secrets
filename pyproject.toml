[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dso-secrets"
version = "0.3.2"
description = "CRUD de secrets OVHcloud OKMS (Secret Manager) avec mode distant et mode local hors ligne"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
dso-secrets = "dso_secrets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

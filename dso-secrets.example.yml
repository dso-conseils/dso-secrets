# Copier en dso-secrets.yml. Ce fichier ne contient JAMAIS de secret.
mode: remote # remote ou local

remote:
  okms_id: 00000000-0000-0000-0000-000000000000
  api_url: https://eu.api.ovh.com/v2
  token_url: https://www.ovh.com/auth/oauth2/token
  read_user_env: DSO_OKMS_USER # nom de la variable d'environnement (pas sa valeur)
  read_pass_env: DSO_OKMS_PASS
  write_secret: dso-conseils/accounts/okms-write # secret OKMS contenant client_id et client_secret du compte d'ecriture
  max_versions: 3

local:
  env_file: ./dso-secrets.env # fichier KEY=VALUE, lecture seule
